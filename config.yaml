- name: ♻️ 自动选择
  type: url-test
  include-all-proxies: true
  exclude-filter: (?i)(?:(?:(剩余|流量|套餐|到期|重置|官网|Traffic|Expire))|(?:(?:(?:((?:香港|Hong Kong|\bHK\b))))))
